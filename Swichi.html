<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Switch Library - 1カラムレイアウト</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #1a1a1a; 
            margin: 0; 
            padding: 10px; 
            color: #333; 
        }
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); 
            overflow: hidden; 
        }
        
        /* ヘッダー */
        .header { 
            background: #e60012; 
            color: white; 
            padding: 10px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 4px solid #b3000e; 
        }
        .header h1 { 
            margin: 0; 
            font-size: 18px; 
            letter-spacing: 1px; 
        }
        .count-area { 
            display: flex; 
            align-items: baseline; 
            gap: 5px; 
        }
        .count-num { 
            font-size: 32px; 
            font-weight: 900; 
            margin: 0; 
        }
        .count-unit { 
            font-size: 14px; 
            opacity: 0.8; 
        }
        
        /* パネル全体を2列に */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            padding: 20px;
        }

        /* 左カラム：追加・検索・バックアップ */
        .left-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .panel { 
            padding: 20px; 
            border: 1px solid #eee; 
            border-radius: 10px;
            background: #fafafa;
        }
        .section-title { 
            font-size: 16px; 
            font-weight: bold; 
            color: #666; 
            margin-bottom: 10px; 
            display: block; 
        }

        /* 追加ボタンと入力 */
        .add-input { 
            width: 100%; 
            padding: 15px; 
            border: 3px solid #ddd; 
            border-radius: 10px; 
            font-size: 18px; 
            box-sizing: border-box; 
            margin-bottom: 10px; 
        }
        .btn-add { 
            background: #e60012; 
            color: white; 
            width: 100%; 
            font-size: 20px; 
            padding: 15px; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
        }

        /* 検索エリア */
        .search-panel { 
            padding: 15px; 
            background: #f0f8ff; 
            border: 1px solid #d0e8ff;
            border-radius: 10px;
        }
        .search-row { 
            display: flex; 
            gap: 8px; 
            align-items: center; 
        }
        .search-input { 
            flex: 1; 
            padding: 10px 12px; 
            border: 2px solid #ccc; 
            border-radius: 6px; 
            font-size: 16px; 
        }
        .btn-search { 
            background: #333; 
            color: white; 
            padding: 10px 15px; 
            font-size: 14px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
        }
        .btn-reset { 
            background: #bbb; 
            color: white; 
            padding: 10px 15px; 
            font-size: 14px; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
        }

        /* バックアップセクション */
        .backup-panel { 
            background: #f0faff; 
            border: 3px dashed #007bff; 
            border-radius: 15px; 
            padding: 20px; 
        }
        .btn-export { 
            background: #007bff; 
            color: white; 
            width: 100%; 
            margin-bottom: 10px; 
            font-size: 18px; 
            padding: 15px; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .btn-import { 
            background: #28a745; 
            color: white; 
            width: 100%; 
            font-size: 18px; 
            padding: 15px; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
        }

        /* 右カラム：リスト表示（1列グリッド） */
        .list-area { 
            height: 1200px; 
            overflow-y: auto; 
            background: #fff; 
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 10px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            align-content: start;
        }
        
        .item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 12px 15px; 
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
            transition: all 0.2s;
        }
        .item:hover {
            background: #f0f0f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .item-name { 
            font-size: 14px; 
            font-weight: 600; 
            color: #000; 
            flex: 1; 
            margin-right: 10px;
            line-height: 1.4;
        }
        .btn-del { 
            color: #ff4d4d; 
            border: 2px solid #ff4d4d; 
            padding: 4px 8px; 
            font-size: 12px; 
            border-radius: 6px; 
            background: white; 
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .footer-tools { 
            padding: 15px; 
            background: #eee; 
            text-align: center; 
            grid-column: 1 / -1;
        }

        /* モバイル対応 */
        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .list-area {
                height: 800px;
            }
            .item-name {
                font-size: 13px;
            }
        }
    </style>
</head>

    const STORAGE_KEY = "switch_2column_v1";
    let masterList = [];

    function init() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved && JSON.parse(saved).length > 0) {
            masterList = JSON.parse(saved);
        } else {
            masterList = [...DEFAULT_DATA];
        }
        render();
    }

    function render(keyword = "") {
        const listArea = document.getElementById('listArea');
        const countDisplay = document.getElementById('totalCount');
        listArea.innerHTML = "";

        let displayList = masterList.filter(t => t.toLowerCase().includes(keyword.toLowerCase()));
        displayList.sort((a, b) => a.localeCompare(b, 'ja'));

        displayList.forEach((name, i) => {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `<span class="item-name">${name}</span>
                             <button class="btn-del" onclick="deleteItem('${name.replace(/'/g, "\\'")}')">削除</button>`;
            listArea.appendChild(div);
        });

        countDisplay.innerText = masterList.length;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(masterList));
    }

    function addItem() {
        const input = document.getElementById('addInput');
        if (input.value.trim()) {
            masterList.push(input.value.trim());
            input.value = "";
            render();
        }
    }

    function runSearch() {
        render(document.getElementById('searchInput').value.trim());
    }

    function resetSearch() {
        document.getElementById('searchInput').value = "";
        render();
    }

    function deleteItem(target) {
        if (confirm(`「${target}」を削除しますか？`)) {
            masterList = masterList.filter(t => t !== target);
            render();
        }
    }

    function exportToFile() {
        const data = JSON.stringify(masterList, null, 2);
        const blob = new Blob([data], {type: 'text/plain'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const date = new Date().toISOString().split('T')[0];
        a.href = url; 
        a.download = `switch_list_${date}.txt`;
        a.setAttribute('download', `switch_list_${date}.txt`);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function triggerFilePicker() { document.getElementById('fileInput').click(); }

    function importFromFile(files) {
        if (files.length === 0) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (Array.isArray(data)) {
                    if (confirm(`${data.length}件を読み込みます。上書きしてよろしいですか？`)) {
                        masterList = data; render(); alert("完了しました！");
                    }
                }
            } catch (err) { alert("正しいファイルではありません。"); }
        };
        reader.readAsText(files[0]);
    }

    function forceReset() {
        if (confirm("初期状態に戻しますか？")) { localStorage.removeItem(STORAGE_KEY); init(); }
    }

    init();
</script>

</body>
</html>
